services:
  proxy-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy-router
    command:
      - --bind
      - 0.0.0.0
      - --mixed-port
      - "8799"
      - --dashboard-bind
      - 0.0.0.0
      - --dashboard-port
      - "8798"
      - --router-config-file
      - /data/router-config.json
      - --usage-log-file
      - /data/usage.log
      - --failure-log-file
      - /data/failures.log
    ports:
      - "8799:8799"
      - "8798:8798"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8798/api/dashboard", timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
