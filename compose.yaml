services:
  proxy-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy-router
    network_mode: host
    command:
      - --bind
      - 0.0.0.0
      - --mixed-port
      - "8900"
      - --dashboard-bind
      - 127.0.0.1
      - --dashboard-port
      - "18798"
      - --router-config-file
      - /data/router-config.json
      - --usage-log-file
      - /data/usage.log
      - --failure-log-file
      - /data/failures.log
      - --https-traffic-log-file
      - /data/https-traffic.log
      - --error-log-file
      - /data/error.log
      - --https-intercept-ca-cert-file
      - /data/https-interception/proxy-router-ca.crt
      - --https-intercept-ca-key-file
      - /data/https-interception/proxy-router-ca.key
      - --https-intercept-cert-cache-dir
      - /data/https-interception/certs
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:18798/api/dashboard", timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy-router-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxy-router-dashboard
    network_mode: host
    depends_on:
      proxy-router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8798/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
